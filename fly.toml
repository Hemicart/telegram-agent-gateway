# Launch with: fly launch --copy-config --ha=false   (exactly one machine)
# Create the volume first: fly volumes create tgdata --size 1
app = "YOUR_APP_NAME"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "tgdata"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
